<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;"
    />
    <title>Scribe</title>
    <link rel="stylesheet" href="./index.css" />
  </head>
  <body>
    <!--
      Superfície do renderer: um único canvas "editor" + overlay de UI.

      O canvas é o alvo do RenderPipeline (backend Canvas2D ou WebGPU — ver
      docs/architecture/04-render-e-ui.md). O overlay fica FORA do canvas para que a
      pipeline só desenhe conteúdo de documento (damage rects).
    -->
    <div id="app" role="application" aria-label="Scribe">
      <div id="tab-bar" role="tablist" aria-label="Documentos"></div>
      <canvas id="editor-surface" tabindex="0"></canvas>
      <div id="ui-overlay" aria-hidden="false">
        <!--
          Find bar (busca/substituição): casca DOM que só REFLETE o `FindBarModel` (a lógica —
          debounce, navegação, descarte de resposta obsoleta — vive em ./find-bar.ts e é testada).
          Escondida por padrão (`hidden`); o renderer alterna conforme o estado do modelo.
        -->
        <div id="find-bar" role="search" aria-label="Buscar e substituir" hidden>
          <input id="find-input" type="text" placeholder="Buscar" aria-label="Buscar" autocomplete="off" spellcheck="false" />
          <span id="find-count" aria-live="polite">0/0</span>
          <div class="find-toggles">
            <button id="find-case" class="find-toggle" title="Case-sensitive (Ctrl+Alt+C)">Aa</button>
            <button id="find-regex" class="find-toggle" title="Regex (Ctrl+Alt+R)">.*</button>
            <button id="find-word" class="find-toggle" title="Whole word (Ctrl+Alt+W)">\b</button>
          </div>
          <input id="find-replace-input" type="text" placeholder="Substituir" aria-label="Substituir" autocomplete="off" spellcheck="false" />
          <button id="find-replace-all" type="button">Substituir tudo</button>
          <span id="find-status" aria-live="polite"></span>
          <button id="find-close" type="button" aria-label="Fechar busca">✕</button>
        </div>
        <div id="status-bar" role="status">
          <span id="status-doc">sem documento</span>
          <span id="status-backend">backend: ?</span>
          <span id="status-caret">1:1</span>
          <span id="status-undo" class="disabled">↶ undo</span>
          <span id="status-redo" class="disabled">↷ redo</span>
          <span id="status-dirty"></span>
          <span id="status-theme" class="clickable" title="Alternar tema (Ctrl+Shift+T)" role="button" tabindex="0">🌙</span>
        </div>
        <!-- Menu/panels (find, palette, tabs) entram aqui na Fase 3.2+. -->
      </div>
    </div>
    <script src="./main.js"></script>
  </body>
</html>
